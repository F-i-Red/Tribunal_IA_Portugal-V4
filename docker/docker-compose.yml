version: '3.9'

# ══════════════════════════════════════════════════════════════════
#  Tribunal IA Portugal V6 — Docker Compose
#
#  Uso básico (OpenRouter):
#    docker compose up -d
#
#  Com API REST separada:
#    docker compose --profile api up -d
#
#  Com Ollama local (soberania de dados total):
#    docker compose --profile ollama up -d
#
#  Completo (Streamlit + API + Ollama):
#    docker compose --profile api --profile ollama up -d
# ══════════════════════════════════════════════════════════════════

services:

  # ── Interface Streamlit ──────────────────────────────────────
  tribunal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tribunal_ia_v6
    restart: unless-stopped
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_OFFLINE=0
      # Se usar Ollama no Docker, apontar para o container
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - tribunal_leis:/app/data/leis
      - tribunal_jurisprudencia:/app/data/jurisprudencia
      - tribunal_precedentes:/app/data/precedentes
      - tribunal_tedh:/app/data/tedh
      - tribunal_atas:/app/output_atas
      - tribunal_cache:/app/src/cache/data
      - tribunal_historico:/app/src/historico/data
      - tribunal_logs:/app/logs
      # Cache de modelos HuggingFace (sentence-transformers)
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # mais tempo para carregar embeddings
    networks:
      - tribunal_net
    depends_on:
      ollama:
        condition: service_healthy
        required: false

  # ── API REST FastAPI (perfil: api) ────────────────────────────
  tribunal-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tribunal_ia_v6_api
    restart: unless-stopped
    profiles:
      - api
    command: python api_server.py --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - tribunal_leis:/app/data/leis
      - tribunal_jurisprudencia:/app/data/jurisprudencia
      - tribunal_precedentes:/app/data/precedentes
      - tribunal_tedh:/app/data/tedh
      - tribunal_atas:/app/output_atas
      - tribunal_cache:/app/src/cache/data
      - tribunal_historico:/app/src/historico/data
      - tribunal_logs:/app/logs
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/saude"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - tribunal_net
    depends_on:
      ollama:
        condition: service_healthy
        required: false

  # ── Ollama local (perfil: ollama) ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: tribunal_ollama
    restart: unless-stopped
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tribunal_net
    # Para GPU NVIDIA (descomenta):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  tribunal_leis:
  tribunal_jurisprudencia:
  tribunal_precedentes:
  tribunal_tedh:
  tribunal_atas:
  tribunal_cache:
  tribunal_historico:
  tribunal_logs:
  ollama_models:
  hf_cache:       # cache HuggingFace para sentence-transformers

networks:
  tribunal_net:
    driver: bridge
